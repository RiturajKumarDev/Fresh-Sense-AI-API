services:
  - type: web
    name: fresh-sense-ai
    runtime: python
    repo: https://github.com/yourusername/fresh-sense-ai # Update with your repo URL
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.0
      - key: FLASK_ENV
        value: production
      - key: PORT
        value: 10000
