[project]
name = "vegetable-freshness-api"
version = "1.0.0"
description = "Vegetable Freshness Prediction API"
requires-python = ">=3.11,<3.12"
dependencies = [
    "flask==2.3.3",
    "flask-cors==4.0.0",
    "scikit-learn==1.3.2",
    "joblib==1.3.2",
    "numpy==1.23.5",
    "scipy==1.10.1"
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"